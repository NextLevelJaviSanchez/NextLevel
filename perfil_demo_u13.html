<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sofía Pérez · NextLevel DEMO</title><style>
:root {
  --bg:#03080f; --bg2:#060d1a; --card:#0b1528; --card2:#0f1e35;
  --border:rgba(255,255,255,0.07);
  --ac:#f97316; --ac2:#fb923c;
  --green:#22c55e; --blue:#3b82f6; --purple:#a855f7;
  --cyan:#06b6d4; --yellow:#facc15; --red:#ef4444;
  --text:#e2e8f0; --muted:#64748b; --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:72px}

/* HERO */
.hero{background:linear-gradient(145deg,#010608 0%,#1a0800 45%,#0a1200 75%,rgba(249,115,22,0.1) 100%);border-bottom:1px solid rgba(249,115,22,0.2);position:relative;overflow:hidden}
.hero-glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(249,115,22,0.12) 0%,transparent 70%);top:-120px;right:-80px;pointer-events:none}
.hero-inner{position:relative;z-index:1;padding:28px 20px 22px;max-width:900px;margin:0 auto}
.hero-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.hero-num{width:68px;height:68px;border-radius:16px;flex-shrink:0;background:linear-gradient(135deg,rgba(249,115,22,0.25),rgba(249,115,22,0.06));border:2px solid rgba(249,115,22,0.5);display:flex;align-items:center;justify-content:center;font-size:1.9rem;font-weight:900;color:var(--ac);box-shadow:0 0 28px rgba(249,115,22,0.2)}
.hero-info{flex:1}
.hero-name{font-size:clamp(1.4rem,5.5vw,2.2rem);font-weight:900;letter-spacing:-1px;line-height:1.05}
.hero-name span{color:var(--ac)}
.hero-sub{font-size:0.73rem;color:var(--muted);margin-top:4px}
.hero-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.htag{padding:3px 10px;border-radius:20px;font-size:0.6rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.ht-or{background:rgba(249,115,22,0.12);border:1px solid rgba(249,115,22,0.3);color:#fb923c}
.ht-gr{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);color:#86efac}
.ht-pu{background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.25);color:#d8b4fe}
.ht-cy{background:rgba(6,182,212,0.1);border:1px solid rgba(6,182,212,0.25);color:#67e8f9}
.ht-ye{background:rgba(250,204,21,0.1);border:1px solid rgba(250,204,21,0.25);color:#fde047}
.hero-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:rgba(255,255,255,0.03);border:1px solid rgba(249,115,22,0.12);border-radius:10px;padding:10px 8px;text-align:center}
.kpi-val{font-size:1.25rem;font-weight:900;color:var(--ac);line-height:1}
.kpi-lbl{font-size:0.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.nl-badge{flex-shrink:0;text-align:center}
.nl-logo{width:90px;height:auto;display:block;margin:0 auto}
.nl-text{font-size:0.48rem;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}

/* TAB BAR */
.tab-bar{background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;display:flex;position:sticky;top:0;z-index:200;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{padding:13px 16px;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab-btn.on{color:var(--ac);border-bottom-color:var(--ac)}
.tab-btn:hover{color:var(--text)}
.tab-pane{display:none;max-width:900px;margin:0 auto;padding:20px 16px 80px}
.tab-pane.on{display:block}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:18px;margin-bottom:14px}
.card-ttl{font-size:0.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-ttl::after{content:'';flex:1;height:1px;background:rgba(249,115,22,0.12)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:480px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}

/* STAT CELLS */
.stat-cell{background:var(--card2);border-radius:10px;padding:12px 8px;text-align:center;border:1px solid rgba(255,255,255,0.04)}
.sc-val{font-size:1.3rem;font-weight:900;line-height:1}
.sc-lbl{font-size:0.52rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.sc-sub{font-size:0.6rem;margin-top:3px;font-weight:600}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}

/* SHOT MAP */
.shot-court{position:relative;width:100%;max-width:380px;margin:0 auto;aspect-ratio:9/6;background:linear-gradient(180deg,#0a1220 0%,#060e18 100%);border:1px solid rgba(249,115,22,0.12);border-radius:12px;overflow:hidden}
.court-lines{position:absolute;inset:0;pointer-events:none}
.shot-dot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);transition:transform .1s}
.shot-dot:hover{transform:translate(-50%,-50%) scale(1.5)}
.zone-label{position:absolute;font-size:0.5rem;font-weight:700;color:rgba(255,255,255,0.2);transform:translate(-50%,-50%);pointer-events:none;text-transform:uppercase;letter-spacing:.4px;text-align:center}

/* RADAR BARS */
.radar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.radar-lbl{font-size:0.6rem;color:var(--muted);width:90px;text-align:right;flex-shrink:0}
.radar-bg{flex:1;height:7px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden}
.radar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.radar-pct{font-size:0.62rem;font-weight:700;width:34px;text-align:left;flex-shrink:0}
.pct-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pct-cell{background:var(--card2);border-radius:8px;padding:8px;text-align:center}
.pct-v{font-size:1rem;font-weight:900;line-height:1}
.pct-l{font-size:0.5rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

/* COACH IA */
.ia-box{background:linear-gradient(135deg,rgba(249,115,22,0.05),rgba(168,85,247,0.03));border:1px solid rgba(249,115,22,0.18);border-radius:14px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.ia-box::before{content:'🏀';position:absolute;top:10px;right:14px;font-size:1.8rem;opacity:0.06}
.ia-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ia-ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#c2410c,#f97316);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.ia-ttl{font-size:0.8rem;font-weight:800;color:var(--ac2)}
.ia-sub{font-size:0.6rem;color:#c2410c;margin-top:1px}
.ia-sec{margin-bottom:14px}
.ia-lbl{font-size:0.58rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.or{color:var(--ac)}.gr{color:var(--green)}.bl{color:var(--blue)}.pu{color:var(--purple)}.cy{color:var(--cyan)}.ye{color:var(--yellow)}
.ia-txt{font-size:0.76rem;color:#94a3b8;line-height:1.7}
.ia-txt strong{color:var(--text);font-weight:600}
.drill-box{background:rgba(249,115,22,0.05);border:1px solid rgba(249,115,22,0.15);border-radius:10px;padding:11px 14px;margin-top:6px}
.drill-ttl{font-size:0.63rem;font-weight:700;color:var(--ac2);margin-bottom:4px}
.drill-txt{font-size:0.71rem;color:#94a3b8;line-height:1.6}
.ia-ft{font-size:0.56rem;color:#334155;margin-top:12px;text-align:right;border-top:1px solid rgba(255,255,255,0.04);padding-top:8px}

/* BARRAS DEFENSIVAS */
.def-bar-wrap{margin-bottom:10px}
.def-bar-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.def-bar-lbl{font-size:0.63rem;color:var(--text);font-weight:600}
.def-bar-val{font-size:0.7rem;font-weight:800}
.def-bar-bg{height:8px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden}
.def-bar-fill{height:100%;border-radius:4px}

/* INSIGHT CARDS */
.insight-card{border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.insight-up{background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.18)}
.insight-down{background:rgba(239,68,68,0.05);border:1px solid rgba(239,68,68,0.15)}
.insight-flat{background:rgba(100,116,139,0.06);border:1px solid rgba(100,116,139,0.15)}
.insight-tip{background:rgba(249,115,22,0.05);border:1px solid rgba(249,115,22,0.18)}
.insight-icon{font-size:1.2rem;flex-shrink:0;margin-top:1px}
.insight-txt{font-size:0.74rem;color:#94a3b8;line-height:1.65}
.insight-txt strong{color:var(--text);font-weight:600}

/* EVOLUCIÓN 5v5 */
.evol-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.evol-row:last-child{border-bottom:none}
.evol-lbl{font-size:0.65rem;color:var(--text);font-weight:600;width:88px;flex-shrink:0}
.evol-vals{display:flex;gap:6px;align-items:center;flex:1}
.evol-num{font-size:0.82rem;font-weight:900;min-width:36px;text-align:center}
.evol-arrow{font-size:0.9rem;flex-shrink:0}
.evol-bar-wrap{flex:1;height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden}
.evol-bar{height:100%;border-radius:3px;transition:width .5s ease}

/* OBJETIVOS CON ESTADO */
.obj-item{background:var(--card2);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.04);transition:border-color .15s}
.obj-item.activo{border-color:rgba(249,115,22,0.3)}
.obj-item.cumplido{border-color:rgba(34,197,94,0.25);opacity:0.7}
.obj-item.pausado{border-color:rgba(100,116,139,0.2);opacity:0.55}
.obj-hdr{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.obj-badge{padding:2px 9px;border-radius:20px;font-size:0.52rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.obj-activo{background:rgba(249,115,22,0.15);color:#fb923c;border:1px solid rgba(249,115,22,0.3)}
.obj-cumplido{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.25)}
.obj-pausado{background:rgba(100,116,139,0.1);color:#94a3b8;border:1px solid rgba(100,116,139,0.2)}
.obj-ttl{font-size:0.73rem;font-weight:700;color:var(--text)}
.obj-txt{font-size:0.66rem;color:#94a3b8;line-height:1.55}
.obj-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.obj-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:7px;padding:4px 10px;font-size:0.6rem;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;transition:all .12s}
.obj-btn:hover{border-color:rgba(249,115,22,0.35);color:#fb923c}
.obj-btn.prim{background:rgba(249,115,22,0.1);border-color:rgba(249,115,22,0.3);color:#fb923c}

/* DASHBOARD */
.dash-section{margin-bottom:14px}
.dash-kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.dash-kpi{background:var(--card);border-radius:12px;padding:12px 10px;text-align:center;border:1px solid var(--border)}
.dash-kpi-val{font-size:1.3rem;font-weight:900;line-height:1}
.dash-kpi-lbl{font-size:0.5rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.dash-kpi-sub{font-size:0.58rem;font-weight:700;margin-top:2px}
.logro-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.logro-item:last-child{border-bottom:none}
.logro-icon{font-size:1.1rem;flex-shrink:0}
.logro-txt{font-size:0.7rem;color:#94a3b8;line-height:1.5}
.logro-txt strong{color:var(--text)}

/* PLAYER REPORT — solo activo en @media print */
.report-section{display:none}
@media print{
  .tab-bar,.bnav,.btn-cv,.obj-btn,.btn-reg,.btn-how,#how-modal-bg{display:none!important}
  body{background:#fff!important;color:#111!important;padding:0!important;font-size:10pt}
  .tab-pane{display:none!important}
  .report-section{display:block!important;page-break-inside:avoid}
  .report-page{padding:1.2cm 1.5cm;max-width:100%}
  .rpt-h1{font-size:18pt;font-weight:900;color:#1a1a1a;margin-bottom:4pt}
  .rpt-h2{font-size:11pt;font-weight:800;color:#c2410c;text-transform:uppercase;letter-spacing:.5pt;margin:14pt 0 6pt;border-bottom:1pt solid #f0e0d0;padding-bottom:3pt}
  .rpt-h3{font-size:9.5pt;font-weight:700;color:#333;margin:8pt 0 3pt}
  .rpt-txt{font-size:9pt;color:#444;line-height:1.55;margin-bottom:5pt}
  .rpt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8pt;margin:6pt 0 10pt}
  .rpt-kpi{background:#fafafa;border:1pt solid #e8e0d8;border-radius:5pt;padding:7pt 5pt;text-align:center}
  .rpt-kpi-v{font-size:14pt;font-weight:900;color:#c2410c}
  .rpt-kpi-l{font-size:7pt;color:#888;text-transform:uppercase;letter-spacing:.4pt;margin-top:2pt}
  .rpt-row{display:flex;gap:6pt;margin-bottom:4pt;align-items:flex-start}
  .rpt-dot{font-size:8pt;flex-shrink:0;margin-top:2pt}
  .rpt-coach-box{background:#fff8f3;border:1pt solid #f0cdb0;border-radius:5pt;padding:10pt;margin:6pt 0}
  .rpt-footer{font-size:7pt;color:#aaa;text-align:center;margin-top:20pt;border-top:0.5pt solid #ddd;padding-top:6pt}
}

/* PROGRESIÓN */
.prog-wrap{position:relative;height:200px;margin-bottom:14px}

/* PLAN */
.plan-item{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border-radius:12px;padding:13px 14px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.04)}
.plan-num{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:900}
.plan-ttl{font-size:0.73rem;font-weight:700;color:var(--text);margin-bottom:3px}
.plan-txt{font-size:0.68rem;color:#94a3b8;line-height:1.6}
.plan-tag{display:inline-block;padding:1px 8px;border-radius:8px;font-size:0.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:5px}

/* FÍSICO */
/* ── TAB FÍSICO — rediseño completo ── */
.antro-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.antro-pill{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;flex:1;min-width:72px}
.antro-v{font-size:1.05rem;font-weight:900;line-height:1}
.antro-l{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.antro-src-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.2);border-radius:20px;padding:2px 9px;font-size:0.6rem;font-weight:700;color:#38bdf8}
/* tarjeta de test */
.test-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;transition:border-color .15s}
.test-card:hover{border-color:rgba(255,255,255,0.12)}
.tc-head{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.tc-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.tc-info{flex:1;min-width:0}
.tc-cap{font-size:0.58rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:1px}
.tc-name{font-size:0.82rem;font-weight:800;line-height:1.2}
.tc-result-wrap{text-align:right;flex-shrink:0}
.tc-result{font-size:1.3rem;font-weight:900;line-height:1}
.tc-result-lbl{font-size:0.56rem;color:var(--muted);margin-top:1px}
.tc-chevron{color:var(--muted);font-size:0.85rem;flex-shrink:0;transition:transform .2s}
.test-card.open .tc-chevron{transform:rotate(90deg)}
/* panel de detalle expandible */
.tc-detail{display:none;border-top:1px solid var(--border)}
.test-card.open .tc-detail{display:block}
.tc-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--border)}
.tc-stat{text-align:center;padding:10px 6px;border-right:1px solid var(--border)}
.tc-stat:last-child{border-right:none}
.tc-stat-v{font-size:0.92rem;font-weight:900;line-height:1}
.tc-stat-l{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.tc-stat-d{font-size:0.65rem;font-weight:700;margin-top:2px}
.delta-up{color:#22c55e}.delta-dn{color:#ef4444}.delta-eq{color:var(--muted)}
/* minigráfico */
.tc-chart-wrap{padding:12px 14px 0}
.tc-chart-title{font-size:0.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px}
.tc-chart-canvas{width:100%!important;height:80px!important}
/* historial compacto */
.tc-history{padding:0 14px 12px}
.tc-hist-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.tc-hist-item:last-child{border-bottom:none}
.tc-hist-date{font-size:0.65rem;color:var(--muted);min-width:72px}
.tc-hist-val{font-size:0.78rem;font-weight:700;flex:1}
.tc-hist-src{font-size:0.6rem;padding:1px 7px;border-radius:8px;font-weight:600}
.src-self{background:rgba(249,115,22,0.12);color:#f97316}
.src-coach{background:rgba(56,189,248,0.12);color:#38bdf8}
/* botones del test */
.tc-btns{display:flex;gap:8px;padding:12px 14px}
.btn-reg{flex:1;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;padding:9px 12px;border:none;border-radius:9px;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-how{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);padding:9px 12px;border-radius:9px;font-size:0.78rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-how:hover{border-color:rgba(255,255,255,0.15);color:#e2e8f0}
/* formulario de registro */
.tc-form{display:none;border-top:1px solid var(--border);padding:14px}
.test-card.reg-open .tc-form{display:block}
.fl{font-size:0.67rem;font-weight:600;color:var(--muted);margin-bottom:4px;display:block}
.fi{font-family:inherit;font-size:0.9rem;color:#e2e8f0;background:#0a1525;border:1px solid var(--border);border-radius:8px;padding:9px 11px;width:100%;outline:none;transition:border .15s}
.fi:focus{border-color:var(--ac)}
.fi[readonly]{background:#07101f;cursor:default;color:var(--muted)}
.form-g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.calc-strip{background:rgba(249,115,22,0.05);border:1px solid rgba(249,115,22,0.15);border-radius:9px;padding:10px;margin:6px 0 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.cs-v{font-size:1rem;font-weight:900;color:var(--ac);line-height:1}
.cs-l{font-size:0.57rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.best-box{background:rgba(34,197,94,0.07);border:1px solid rgba(34,197,94,0.18);border-radius:8px;padding:8px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.best-lbl{font-size:0.65rem;color:#4ade80;font-weight:600}
.best-val{font-size:1.05rem;font-weight:900;color:#4ade80}
.btn-save-test{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;padding:10px;width:100%;font-size:0.85rem;font-weight:700;border:none;border-radius:9px;cursor:pointer;font-family:inherit}
/* modal instrucciones */
.how-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:600;align-items:flex-end;justify-content:center}
.how-modal-bg.on{display:flex}
.how-modal{background:#0d1829;border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.08);border-bottom:none;padding:0 0 32px}
.how-modal-hd{position:sticky;top:0;background:#0d1829;padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;z-index:1}
.how-modal-title{font-size:0.92rem;font-weight:800;color:var(--ac)}
.how-modal-close{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:0 4px}
.how-body{padding:16px}
.how-h{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:14px 0 6px}
.how-h:first-child{margin-top:0}
.how-p{font-size:0.78rem;color:#94a3b8;line-height:1.7}
.how-steps{list-style:none;counter-reset:steps;display:flex;flex-direction:column;gap:6px}
.how-steps li{counter-increment:steps;display:flex;gap:10px;font-size:0.78rem;color:#94a3b8;line-height:1.6}
.how-steps li::before{content:counter(steps);min-width:22px;height:22px;border-radius:50%;background:rgba(249,115,22,0.15);border:1px solid rgba(249,115,22,0.3);color:#f97316;font-weight:900;font-size:0.7rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.how-pill{display:inline-block;background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.2);border-radius:6px;padding:1px 8px;font-size:0.72rem;font-weight:700;color:#f97316;margin:2px}
.how-warn{background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.15);border-radius:8px;padding:9px 12px;font-size:0.73rem;color:#fca5a5;line-height:1.6;margin-top:8px}
.how-diagram{margin:10px 0;border-radius:10px;overflow:hidden;background:var(--card2);padding:14px;text-align:center}
/* audio beep */
.beep-audio-box{background:rgba(56,189,248,0.06);border:1px solid rgba(56,189,248,0.18);border-radius:10px;padding:12px 14px;margin-top:10px}
.beep-audio-title{font-size:0.7rem;font-weight:700;color:#38bdf8;margin-bottom:8px}
.btn-play-beep{display:flex;align-items:center;gap:8px;background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.3);color:#38bdf8;padding:10px 14px;border-radius:9px;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:inherit;width:100%;justify-content:center}
.btn-play-beep:hover{background:rgba(56,189,248,0.2)}
/* no-data */
.tc-nodata{text-align:center;padding:18px 0;color:var(--muted);font-size:0.78rem}
.coach-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.25);border-radius:20px;padding:3px 10px;font-size:0.62rem;font-weight:700;color:#38bdf8}
.alerta-box{background:rgba(250,204,21,0.05);border:1px solid rgba(250,204,21,0.15);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.alerta-ttl{font-size:0.62rem;font-weight:700;color:var(--yellow);margin-bottom:5px}
.alerta-txt{font-size:0.71rem;color:#94a3b8;line-height:1.65}

/* PERFIL */
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile-field{background:var(--card2);border-radius:10px;padding:11px 13px;border:1px solid rgba(255,255,255,0.04)}
.pf-lbl{font-size:0.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.pf-val{font-size:0.8rem;font-weight:700;color:var(--text)}
.pf-chip{background:var(--card2);border:1.5px solid var(--border);border-radius:9px;padding:9px 10px;font-size:0.72rem;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;transition:all .15s;user-select:none}
.pf-chip:hover{border-color:rgba(249,115,22,0.35);color:#e2e8f0}
.pf-chip.active{background:rgba(249,115,22,0.12);border-color:rgba(249,115,22,0.5);color:var(--ac);font-weight:700}
.ncaa-box{background:linear-gradient(145deg,#060d1a,#1a0800);border:1px solid rgba(249,115,22,0.2);border-radius:14px;padding:18px;position:relative;overflow:hidden;margin-bottom:14px}
.ncaa-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#f97316,#a855f7,#06b6d4)}
.ncaa-quote{background:rgba(249,115,22,0.04);border-left:3px solid var(--ac);border-radius:0 8px 8px 0;padding:10px 14px;font-size:0.73rem;color:#94a3b8;line-height:1.65;font-style:italic;margin:12px 0}
.btn-cv{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#c2410c,#f97316);border:none;border-radius:10px;color:white;padding:11px 20px;font-size:0.73rem;font-weight:700;cursor:pointer;font-family:inherit;width:100%;margin-top:12px}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:500;background:#07091a;border-top:1px solid rgba(255,255,255,0.07);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px 9px;font-size:0.5rem;font-weight:700;color:#475569;text-decoration:none;text-transform:uppercase;letter-spacing:.5px;gap:2px;transition:color .15s;background:none;border:none;cursor:pointer;font-family:inherit}
.bnav-btn .ni{font-size:1.15rem;line-height:1}
.bnav-btn.on{color:var(--ac)}
.bnav-btn:hover{color:#94a3b8}

/* PRINT */
@media print{
  .tab-bar,.bnav{display:none!important}
  body{background:#fff!important;color:#000!important;padding:0!important}
  .tab-pane{display:block!important;padding:0!important}
  .card,.ia-box,.ncaa-box{border:1px solid #ddd!important;background:#f9f9f9!important}
  .btn-cv{display:none!important}
  @page{margin:1.5cm}
}

.mental-tip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:12px}
.mental-tip-card{background:var(--card2);border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--tip-color,#38bdf8);border-radius:12px;padding:15px;min-width:0}
.mental-tip-title{display:flex;align-items:center;gap:8px;color:var(--tip-color,#38bdf8);font-size:.84rem;line-height:1.4;margin:0 0 10px}
.mental-tip-title span{font-size:1.3rem}
.mental-tip-copy{font-size:.74rem;color:#cbd5e1;line-height:1.7;margin:0}
.mental-tip-practice{margin-top:12px;padding:10px;border-radius:8px;background:rgba(255,255,255,.035);font-size:.7rem;line-height:1.6}
.mental-tip-practice strong{color:var(--tip-color,#38bdf8)}
.mental-tip-practice p{margin:5px 0 0;color:#cbd5e1}
