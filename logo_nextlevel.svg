        font-family="'Arial Black','Franklin Gothic Heavy','Impact',sans-serif"
        font-size="90" font-weight="900" font-style="italic"
        fill="#111111" letter-spacing="-3" textLength="510" lengthAdjust="spacingAndGlyphs">NEXT LEVEL</text>
  <!-- BASKETBALL — naranja, espaciado amplio -->
