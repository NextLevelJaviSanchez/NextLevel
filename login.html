<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NextLevel Basketball · Acceso</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#040c1a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
:root{--ac:#f97316;--card:#0c1828;--input:#0f1f35;--border:rgba(255,255,255,0.08);--r:14px;--rs:9px;--muted:#64748b}

.logo{text-align:center;margin-bottom:36px}
.logo-icon{font-size:3rem;line-height:1;margin-bottom:8px}
.logo-name{font-size:1.6rem;font-weight:900;letter-spacing:-0.5px}
.logo-name span{color:var(--ac)}
.logo-sub{font-size:0.72rem;color:var(--muted);margin-top:4px;letter-spacing:1px;text-transform:uppercase}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;width:100%;max-width:400px}
.card-title{font-size:1rem;font-weight:800;margin-bottom:6px}
.card-sub{font-size:0.75rem;color:var(--muted);margin-bottom:24px}

.field{margin-bottom:16px}
.field label{display:block;font-size:0.68rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.field input{width:100%;background:var(--input);border:1.5px solid var(--border);border-radius:var(--rs);color:#e2e8f0;font-size:0.95rem;padding:12px 14px;outline:none;font-family:inherit;transition:border-color .15s}
.field input:focus{border-color:var(--ac)}

.btn{width:100%;padding:14px;border-radius:var(--rs);background:linear-gradient(135deg,#c2410c,#f97316);color:white;font-size:0.95rem;font-weight:800;border:none;cursor:pointer;transition:opacity .2s;margin-top:4px}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}

.msg{border-radius:var(--rs);padding:10px 14px;font-size:0.78rem;margin-bottom:14px;display:none}
.msg.show{display:block}
.msg.err{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5}
.msg.info{background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.3);color:#7dd3fc}

.footer{margin-top:28px;font-size:0.62rem;color:#1e3a5a;text-align:center;letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>

<div class="logo">
  <div class="logo-icon">🏀</div>
  <div class="logo-name">Next<span>Level</span></div>
  <div class="logo-sub">Basketball Analytics</div>
</div>

<div class="card">
  <div class="card-title">Ingresá a tu perfil</div>
  <div class="card-sub">Accedé con tu email y contraseña</div>

  <div class="msg err" id="err-msg"></div>
  <div class="msg info" id="info-msg">⏳ Verificando…</div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="inp-email" placeholder="tu@email.com" autocomplete="email" inputmode="email">
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn" id="btn-login" onclick="doLogin()">Ingresar →</button>
</div>

<div class="footer">NextLevel Basketball · Demo 2.0</div>

<script>
// ─── Constantes ────────────────────────────────────────────────────────
const SUPA_URL = 'https://yjcxwfkedxzkcspddghz.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqY3h3ZmtlZHh6a2NzcGRkZ2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTcwODksImV4cCI6MjEwNjI5MzA4OX0.j-g-0yt7D8ADkleTFxTNSN5ORPJE8y50aumejW8G4IQ';

const SHORT_IDS = {
  '11111111-0000-0000-0000-000000000014': 'mia14',
  '11111111-0000-0000-0000-000000000008': 'cat8',
  '11111111-0000-0000-0000-000000000006': 'luba6',
  '11111111-0000-0000-0000-000000000012': 'alma12',
  '11111111-0000-0000-0000-000000000010': 'martina10',
};

// ─── UI helpers ────────────────────────────────────────────────────────
function showErr(msg)  { hide('info-msg'); show('err-msg', msg); }
function showInfo(msg) { hide('err-msg');  show('info-msg', msg); }
function hideAll()     { hide('err-msg');  hide('info-msg'); }
function show(id, msg) { const e=document.getElementById(id); e.textContent=msg; e.classList.add('show'); }
function hide(id)      { const e=document.getElementById(id); e.classList.remove('show'); }

function setBusy(on) {
  const btn = document.getElementById('btn-login');
  btn.disabled = on;
  btn.textContent = on ? '⏳ Ingresando…' : 'Ingresar →';
}

// ─── Enter key ─────────────────────────────────────────────────────────
document.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

// ─── LOGIN ─────────────────────────────────────────────────────────────
async function doLogin() {
  hideAll();
  const email = document.getElementById('inp-email').value.trim();
  const pass  = document.getElementById('inp-pass').value;

  if (!email || !pass) { showErr('Completá email y contraseña'); return; }

  setBusy(true);
  showInfo('⏳ Verificando…');

  // Carga dinámica del SDK si no está disponible aún
  if (typeof window.supabase === 'undefined') {
    try {
      await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
    } catch(e) {
      setBusy(false);
      showErr('No se pudo cargar el SDK. Chequeá tu conexión e intentá de nuevo.');
      return;
    }
  }

  const client = window.supabase.createClient(SUPA_URL, SUPA_KEY);

  let data, error;
  try {
    ({ data, error } = await client.auth.signInWithPassword({ email, password: pass }));
  } catch(e) {
    setBusy(false);
    showErr('Error de red: ' + e.message);
    return;
  }

  setBusy(false);
  hideAll();

  if (error) {
    const msgs = {
      'Invalid login credentials': 'Email o contraseña incorrectos',
      'Email not confirmed':        'Confirmá tu email antes de ingresar',
      'Too many requests':          'Demasiados intentos. Esperá unos minutos.',
    };
    showErr(msgs[error.message] || error.message);
    return;
  }

  if (!data?.user) { showErr('Error inesperado. Intentá de nuevo.'); return; }

  // ─── Redirect por rol ───────────────────────────────────────────────
  showInfo('✅ Acceso OK — cargando…');

  const { data: players } = await client
    .from('players')
    .select('id')
    .eq('user_id', data.user.id)
    .limit(1);

  if (players && players.length > 0) {
    const shortId = SHORT_IDS[players[0].id];
    window.location.href = getPlayerHome(shortId);
  } else {
    window.location.href = 'admin.html';
  }
}

// ─── Home por jugadora ─────────────────────────────────────────────────
// Cada jugadora entra a su hub principal al hacer login
function getPlayerHome(shortId) {
  const homes = {
    'mia14':     'intake_mia_sanchez_14_2026.html',
    'cat8':      'intake_catalina_grillo.html',
    'luba6':     'intake_luba_portinari.html',
    'alma12':    'intake_alma_smigiel.html',
    'martina10': 'intake_martina_bailon.html',
  };
  return homes[shortId] || 'evaluacion_fisica_v2.html';
}

// ─── Carga dinámica de script ──────────────────────────────────────────
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload  = resolve;
    s.onerror = () => reject(new Error('Script load failed: ' + src));
    document.head.appendChild(s);
  });
}

// ─── Auto-check sesión activa ──────────────────────────────────────────
window.addEventListener('load', async () => {
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js');
    const client = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    const { data: { session } } = await client.auth.getSession();
    if (session?.user) {
      showInfo('✅ Sesión activa — redirigiendo…');
      const { data: players } = await client.from('players').select('id').eq('user_id', session.user.id).limit(1);
      if (players && players.length > 0) {
        window.location.href = getPlayerHome(SHORT_IDS[players[0].id]);
      } else {
        window.location.href = 'admin.html';
      }
    }
  } catch(e) {
    // SDK no cargó en el arranque — el botón lo intentará de nuevo al hacer click
  }
});
</script>
</body>
</html>
