<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NextLevel Basketball · Acceso</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#040c1a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
:root{--ac:#f97316;--card:#0c1828;--input:#0f1f35;--border:rgba(255,255,255,0.08);--r:14px;--rs:9px;--muted:#64748b}

.logo{text-align:center;margin-bottom:36px}
.logo-icon{font-size:3rem;line-height:1;margin-bottom:8px}
.logo-name{font-size:1.6rem;font-weight:900;letter-spacing:-0.5px}
.logo-name span{color:var(--ac)}
.logo-sub{font-size:0.72rem;color:var(--muted);margin-top:4px;letter-spacing:1px;text-transform:uppercase}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:28px 24px;width:100%;max-width:400px}
.card-title{font-size:1rem;font-weight:800;margin-bottom:6px}
.card-sub{font-size:0.75rem;color:var(--muted);margin-bottom:24px}

.field{margin-bottom:16px}
.field label{display:block;font-size:0.68rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.field input{
  width:100%;background:var(--input);border:1.5px solid var(--border);
  border-radius:var(--rs);color:#e2e8f0;font-size:0.95rem;
  padding:12px 14px;outline:none;font-family:inherit;transition:border-color .15s
}
.field input:focus{border-color:var(--ac)}

.btn{
  width:100%;padding:14px;border-radius:var(--rs);
  background:linear-gradient(135deg,#c2410c,#f97316);
  color:white;font-size:0.95rem;font-weight:800;
  border:none;cursor:pointer;transition:opacity .2s;margin-top:4px
}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}

.err{
  background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);
  border-radius:var(--rs);padding:10px 14px;font-size:0.78rem;color:#fca5a5;
  margin-bottom:14px;display:none
}
.err.show{display:block}

.loading{display:none;text-align:center;padding:12px;font-size:0.82rem;color:var(--muted)}
.loading.show{display:block}

.footer{margin-top:28px;font-size:0.62rem;color:#1e3a5a;text-align:center;letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>

<div class="logo">
  <div class="logo-icon">🏀</div>
  <div class="logo-name">Next<span>Level</span></div>
  <div class="logo-sub">Basketball Analytics</div>
</div>

<div class="card">
  <div class="card-title">Ingresá a tu perfil</div>
  <div class="card-sub">Accedé con tu email y contraseña</div>

  <div class="err" id="err-msg"></div>
  <div class="loading" id="loading">⏳ Verificando...</div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="inp-email" placeholder="tu@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn" id="btn-login" onclick="doLogin()">Ingresar →</button>
</div>

<div class="footer">NextLevel Basketball · Demo 2.0</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPA_URL  = 'https://yjcxwfkedxzkcspddghz.supabase.co';
const SUPA_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqY3h3ZmtlZHh6a2NzcGRkZ2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTcwODksImV4cCI6MjEwNjI5MzA4OX0.j-g-0yt7D8ADkleTFxTNSN5ORPJE8y50aumejW8G4IQ';
const supabase  = window.supabase.createClient(SUPA_URL, SUPA_KEY);

// Si ya hay sesión activa → redirigir directo
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) redirect(session.user);
})();

async function doLogin() {
  const email = document.getElementById('inp-email').value.trim();
  const pass  = document.getElementById('inp-pass').value;
  const btn   = document.getElementById('btn-login');
  const err   = document.getElementById('err-msg');
  const load  = document.getElementById('loading');

  err.classList.remove('show');
  if (!email || !pass) { showErr('Completá email y contraseña'); return; }

  btn.disabled = true;
  load.classList.add('show');

  let data, error;
  try {
    ({ data, error } = await supabase.auth.signInWithPassword({ email, password: pass }));
  } catch(e) {
    load.classList.remove('show');
    btn.disabled = false;
    showErr('Error de conexión: ' + e.message);
    return;
  }

  load.classList.remove('show');
  btn.disabled = false;

  if (error) {
    const msg = error.message === 'Invalid login credentials'
      ? 'Email o contraseña incorrectos'
      : (error.message === 'Email not confirmed'
        ? 'Confirmá tu email antes de ingresar'
        : error.message);
    showErr(msg);
    return;
  }
  if (!data || !data.user) { showErr('Error inesperado — intentá de nuevo'); return; }
  redirect(data.user);
}

async function redirect(user) {
  // Buscar el player vinculado a este user_id
  const { data: players } = await supabase
    .from('players')
    .select('id, name, dorsal')
    .eq('user_id', user.id);

  if (players && players.length > 0) {
    const p = players[0];
    // Jugadora → ir a Preparación Física con su ID
    // Mapeamos el player UUID al id corto para la URL
    const shortId = getShortId(p.id);
    if (shortId) {
      window.location.href = 'evaluacion_fisica_v2.html?player=' + shortId;
    } else {
      window.location.href = 'evaluacion_fisica_v2.html';
    }
  } else {
    // Admin (sin player vinculado) → panel admin
    window.location.href = 'admin.html';
  }
}

function getShortId(uuid) {
  const map = {
    '11111111-0000-0000-0000-000000000014': 'mia14',
    '11111111-0000-0000-0000-000000000008': 'cat8',
    '11111111-0000-0000-0000-000000000006': 'luba6',
    '11111111-0000-0000-0000-000000000012': 'alma12',
    '11111111-0000-0000-0000-000000000010': 'martina10',
  };
  return map[uuid] || null;
}

function showErr(msg) {
  const el = document.getElementById('err-msg');
  el.textContent = msg;
  el.classList.add('show');
}

// Enter para hacer login
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
