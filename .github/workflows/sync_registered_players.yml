name: Actualizar jugadores registrados
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: Temporada (vacío usa el año actual)
        required: false
jobs:
  sync:
    if: vars.REGISTERED_PLAYERS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actualizar cada perfil configurado
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPA_SERVICE_ROLE_KEY: ${{ secrets.SUPA_SERVICE_ROLE_KEY }}
          SYNC_SEASON: ${{ inputs.season }}
        run: python sync_registered_players.py
