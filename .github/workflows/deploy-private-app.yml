name: Revisar acceso privado
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Etapa de publicación
        type: choice
        default: review
        options:
          - review
          - preview
          - maintenance
          - live
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar aislamiento y guardados con cuentas simuladas
        run: |
          npm install --prefix "$RUNNER_TEMP/nextlevel-tests" --no-package-lock --ignore-scripts jsdom@30.1.2 @electric-sql/pglite@0.5.8
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_private_app.cjs
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_mini_level_points.cjs
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_mini_level_points_rls.cjs
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_competition_labels.cjs
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_restoration.cjs
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_physical_restore.cjs
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_plan_restore.cjs
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_profile_home_restore.cjs
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_concurrent_profile.cjs
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_encrypted_drafts.cjs
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_sync_queue.cjs
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_admin_coach.cjs
          node test_personal_goals.cjs
          node test_game_block_goals.cjs
          node test_gradual_goals.cjs
          node scripts/test_final_backend.cjs
          node scripts/test_final_account.cjs
          node scripts/test_service_credential.cjs
          python scripts/test_sync_privacy.py --source sync_registered_players.py
      - name: Comprobar las fuentes y crear el paquete permitido
        env:
          MODE: ${{ inputs.mode }}
        run: |
          node --check private-app/app.js
          node --check private-app/data.js
          node --check private-app/security.js
          if [ "$MODE" = "review" ]; then
            git fetch --depth=1 origin ad1baeb6ee71c75c77def45f35e965c36a097d5b
            python scripts/build_feature_review.py
          else
            python scripts/build_private_pages.py --mode "$MODE"
          fi
      - name: Añadir landing y capturas públicas revisadas
        if: inputs.mode != 'maintenance'
        run: python scripts/add_public_landing.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: privacy-pages-artifact
      - uses: actions/deploy-pages@v4
        id: deployment
