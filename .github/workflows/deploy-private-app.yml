name: Revisar acceso privado
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Etapa de publicación
        type: choice
        default: review
        options:
          - review
          - preview
          - maintenance
          - live
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar aislamiento y guardados con cuentas simuladas
        run: |
          npm install --prefix "$RUNNER_TEMP/nextlevel-tests" --no-package-lock --ignore-scripts jsdom@30.1.2
          NODE_PATH="$RUNNER_TEMP/nextlevel-tests/node_modules" node scripts/test_private_app.cjs
          node test_personal_goals.cjs
          node test_game_block_goals.cjs
          node test_gradual_goals.cjs
      - name: Comprobar las fuentes y crear el paquete permitido
        env:
          MODE: ${{ inputs.mode }}
        run: |
          node --check private-app/app.js
          node --check private-app/data.js
          node --check private-app/security.js
          if [ "$MODE" = "review" ]; then
            git fetch --depth=1 origin 3291be1628b049a1fbf8826c00586a1fc61b3841
            python scripts/build_feature_review.py
          else
            python scripts/build_private_pages.py --mode "$MODE"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: privacy-pages-artifact
      - uses: actions/deploy-pages@v4
        id: deployment
